tool: fast-check
label: "fast-check"
language: typescript
node_version: "18"
typescript_version: "5.9.3"
branch: "TS-085"
scenario: "1 - Monolithic"
architecture: "Monolith"
module: "flat"
package_manager: "pnpm"
bundler: "vite"
project: package.json
tests: tests/
tools_project: "Tool Triggering (Synthetic Data)/"
pinned-version: "4.9.0"
config: "Tool Triggering (Synthetic Data)/mocha/.mocharc.cjs"
target_files: [tests/property.spec.ts]
command: "node_modules/.bin/mocha --config 'Tool Triggering (Synthetic Data)/mocha/.mocharc.cjs' --grep 'properties'"
produces: "property-based test results, 200 runs per property"
