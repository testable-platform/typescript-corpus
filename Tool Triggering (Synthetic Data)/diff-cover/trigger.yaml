tool: diff-cover
label: "diff-cover"
language: typescript
node_version: "20"
typescript_version: "5.9.3"
branch: "TS-101"
scenario: "1 - Monolithic"
architecture: "Monolith"
module: "flat"
package_manager: "pnpm"
bundler: "esbuild"
project: package.json
tests: tests/
