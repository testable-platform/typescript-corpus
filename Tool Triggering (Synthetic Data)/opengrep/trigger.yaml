tool: opengrep
label: "Opengrep"
language: typescript
node_version: "12"
typescript_version: "5.0.4"
branch: "TS-015"
scenario: "1 - Monolithic"
architecture: "Monolith"
module: "flat"
package_manager: "bun"
bundler: "vite"
project: package.json
tests: tests/
tools_project: "Tool Triggering (Synthetic Data)/"
pinned-version: null  # not an npm package -- see the runner
config: "Tool Triggering (Synthetic Data)/opengrep/rules.yml"
target_files: [src/analysis]
command: "opengrep scan --config rules.yml --json --output reports/opengrep.json src"
expects_findings: true
produces: "reports/opengrep.json"
