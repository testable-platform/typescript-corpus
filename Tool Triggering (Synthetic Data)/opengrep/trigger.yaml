tool: opengrep
label: "Opengrep"
language: typescript
node_version: "14"
typescript_version: "5.1.6"
branch: "TS-028"
scenario: "2 - Microservices"
architecture: "Microservices"
module: "workspace"
package_manager: "yarn (Berry)"
bundler: "esbuild"
project: packages/domain/package.json
tests: tests/
tools_project: "Tool Triggering (Synthetic Data)/"
pinned-version: null  # not an npm package -- see the runner
config: "Tool Triggering (Synthetic Data)/opengrep/rules.yml"
target_files: [packages/domain/src/analysis]
command: "opengrep scan --config rules.yml --json --output reports/opengrep.json packages/domain/src"
expects_findings: true
produces: "reports/opengrep.json"
