tool: depscout
label: "DepScout"
language: typescript
node_version: "16"
typescript_version: "5.5.4"
branch: "TS-053"
scenario: "1 - Monolithic"
architecture: "Monolith"
module: "flat"
package_manager: "pnpm"
bundler: "esbuild"
project: package.json
tests: tests/
tools_project: "Tool Triggering (Synthetic Data)/"
pinned-version: "1.0.0"  # installed on demand into reports/.tool-cache, not a package.json dependency
config: "Tool Triggering (Synthetic Data)/depscout/scout.config.json"
target_files: [package.json]
command: "scout  (run in a scratch copy of package.json + scout.config.json)"
produces: "reports/depscout.txt"
