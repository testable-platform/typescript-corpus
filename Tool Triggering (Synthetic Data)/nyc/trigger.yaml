tool: nyc
label: "nyc + ts-node (coverage cross-check)"
language: typescript
node_version: "12"
typescript_version: "5.0.4"
branch: "TS-023"
scenario: "1 - Monolithic"
architecture: "Monolith"
module: "flat"
package_manager: "bun"
bundler: "rollup"
project: package.json
tests: tests/
tools_project: "Tool Triggering (Synthetic Data)/"
pinned-version: "15.1.0"
config: "Tool Triggering (Synthetic Data)/nyc/.nycrc.json"
target_files: [src, tests]
command: "node_modules/.bin/nyc --nycrc-path 'Tool Triggering (Synthetic Data)/nyc/.nycrc.json' node_modules/.bin/mocha --config 'Tool Triggering (Synthetic Data)/mocha/.mocharc.cjs'"
produces: "coverage-nyc/coverage-summary.json -- instruments .ts directly, never via source-map remap"
