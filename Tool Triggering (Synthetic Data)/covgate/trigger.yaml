tool: covgate
label: "covgate"
language: typescript
node_version: "18"
typescript_version: "5.9.3"
branch: "TS-081"
scenario: "1 - Monolithic"
architecture: "Monolith"
module: "flat"
package_manager: "npm"
bundler: "vite"
project: package.json
tests: tests/
tools_project: "Tool Triggering (Synthetic Data)/"
pinned-version: null  # not an npm package -- see the runner
config: "Tool Triggering (Synthetic Data)/covgate/covgate.toml"
target_files: [reports/covgate/coverage-final.json]
command: "covgate check coverage-final.json --diff-file <git diff HEAD~1 HEAD> --markdown-output reports/covgate.md"
produces: "reports/covgate.md"
